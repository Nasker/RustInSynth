[package]
name = "rust_in_synth"
version = "1.2.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Enables plugin-only builds: excludes standalone-only GUI entry points
# (`run_gui`, `StandaloneBackend`) that the audio host does not need.
plugin = []

[dependencies]
cpal = "0.15"
crossterm = "0.27"
parking_lot = "0.12"
midir = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "5.0"
egui = "0.34"
eframe = { version = "0.34", default-features = false, features = ["glow", "default_fonts", "accesskit"] }
# Pinned to eframe 0.34's winit so the standalone GUI can force the X11 backend
# (the Wayland glutin/EGL path fails on some Linux setups).
winit = "0.30"
dashmap = "6.1"
nih_plug = { git = "https://github.com/BillyDM/nih-plug.git", features = ["assert_process_allocs"] }
nih_plug_egui = { git = "https://github.com/BillyDM/nih-plug.git" }

[dev-dependencies]
tempfile = "3.8"
plotters = "0.3"
